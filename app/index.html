<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CA99 Control</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
</head>
<body>
  <header id="topbar">
    <h1>🎹 CA99 Control</h1>
    <span id="active-crumb" class="crumb"></span>
    <div id="conn-status" class="status off">未连接</div>
    <select id="output-select" title="输出端口（发命令）"></select>
    <select id="input-select" title="输入端口（接按键）"></select>
    <button id="connect-btn">连接</button>
  </header>

  <div id="layout">
    <nav id="sidebar">
      <div id="nav-search-wrap">
        <input id="nav-search" type="text" placeholder="🔍 搜索模块…" autocomplete="off" spellcheck="false">
      </div>
      <div class="nav-scroll">
        <div class="nav-group" data-group="控制台">
          <div class="nav-group-title">🎛️ 演奏控制</div>
          <button class="nav-btn active" data-module="sounds">🎵 音色浏览器</button>
          <button class="nav-btn" data-module="vt">🔧 VT 调音台</button>
          <button class="nav-btn" data-module="system">🎛️ 系统/混响</button>
          <button class="nav-btn" data-module="rhythm">🥁 节奏</button>
          <button class="nav-btn" data-module="auto">🔄 自动换音色</button>
          <button class="nav-btn" data-module="morph">🌗 VT 渐变器</button>
          <button class="nav-btn" data-module="velocity">🎚️ 力度换音色</button>
          <button class="nav-btn" data-module="velvt">💫 力度→VT联动</button>
          <button class="nav-btn" data-module="pedal">🦶 踏板控制</button>
          <button class="nav-btn" data-module="presets">⭐ 演出预设</button>
        </div>
        <div class="nav-group" data-group="练习室">
          <div class="nav-group-title">🎓 练习训练</div>
          <button class="nav-btn" data-module="chord">🎓 和弦练习</button>
          <button class="nav-btn" data-module="scale">🎼 音阶练习</button>
          <button class="nav-btn" data-module="sight">👀 视奏闪卡</button>
          <button class="nav-btn" data-module="scf">🎹 曲谱跟弹</button>
          <button class="nav-btn" data-module="ear">👂 音程听辨</button>
          <button class="nav-btn" data-module="dynamics">💪 力度练习</button>
          <button class="nav-btn" data-module="transpose">🎹 移调器</button>
          <button class="nav-btn" data-module="rhythmtrain">🥁 节奏跟拍</button>
          <button class="nav-btn" data-module="melody">🎼 旋律听写</button>
          <button class="nav-btn" data-module="chordprog">🎹 和弦进行</button>
          <button class="nav-btn" data-module="beat">📈 节拍稳定度</button>
          <button class="nav-btn" data-module="hands">🙌 双手协调</button>
          <button class="nav-btn" data-module="arp">🎶 琶音跑动</button>
          <button class="nav-btn" data-module="artic">🎻 连奏断奏</button>
          <button class="nav-btn" data-module="pedt">🦶 踏板时机</button>
          <button class="nav-btn" data-module="trill">🪶 颤音速度</button>
          <button class="nav-btn" data-module="ornament">🎵 装饰音</button>
          <button class="nav-btn" data-module="leap">🎯 音程大跳</button>
          <button class="nav-btn" data-module="voicing">🔝 旋律突出</button>
          <button class="nav-btn" data-module="cresc">🎚️ 力度渐变</button>
          <button class="nav-btn" data-module="temporamp">🚀 速度渐变</button>
          <button class="nav-btn" data-module="poly">🥁 复节奏</button>
          <button class="nav-btn" data-module="even">💧 颗粒性</button>
          <button class="nav-btn" data-module="finger">🖐️ 手指独立性</button>
          <button class="nav-btn" data-module="span">🎹 音阶八度跨度</button>
          <button class="nav-btn" data-module="dict">👂 节奏听写</button>
          <button class="nav-btn" data-module="trans">🎼 移调视奏</button>
          <button class="nav-btn" data-module="inv">🎹 和弦转位听辨</button>
          <button class="nav-btn" data-module="keysig">🎼 调号识别</button>
          <button class="nav-btn" data-module="fing">🖐️ 音阶指法提示</button>
          <button class="nav-btn" data-module="ivb">🎯 音程构建</button>
          <button class="nav-btn" data-module="modeid">🎶 调式识别</button>
          <button class="nav-btn" data-module="solfege">🎵 唱名听辨</button>
          <button class="nav-btn" data-module="cquality">🎹 和弦性质听辨</button>
          <button class="nav-btn" data-module="progear">🎶 和声进行听辨</button>
          <button class="nav-btn" data-module="cad">🔚 终止式辨认</button>
          <button class="nav-btn" data-module="noteid">🔤 键盘音名认知</button>
          <button class="nav-btn" data-module="staffread">🎼 五线谱识谱卡</button>
          <button class="nav-btn" data-module="sphrase">🎼 乐句视奏</button>
          <button class="nav-btn" data-module="csight">🎹 和弦视奏</button>
          <button class="nav-btn" data-module="rsight">🥁 节奏视奏</button>
        </div>
        <div class="nav-group" data-group="工具箱">
          <div class="nav-group-title">🛠️ 工具</div>
          <button class="nav-btn" data-module="cof">🎡 五度圈</button>
          <button class="nav-btn" data-module="metro">🎵 节拍器</button>
          <button class="nav-btn" data-module="recorder">⏺ 录制回放</button>
          <button class="nav-btn" data-module="dash">🏆 成就仪表盘</button>
          <button class="nav-btn" data-module="monitor">📡 MIDI 监视器</button>
        </div>
        <div id="nav-empty" class="nav-empty" hidden>没有匹配的模块</div>
      </div>
    </nav>
    <main id="content">
      <section id="module-sounds" class="module active"></section>
      <section id="module-vt" class="module"></section>
      <section id="module-system" class="module"></section>
      <section id="module-rhythm" class="module"></section>
      <section id="module-auto" class="module"></section>
      <section id="module-morph" class="module"></section>
      <section id="module-velocity" class="module"></section>
      <section id="module-velvt" class="module"></section>
      <section id="module-pedal" class="module"></section>
      <section id="module-presets" class="module"></section>
      <section id="module-chord" class="module"></section>
      <section id="module-metro" class="module"></section>
      <section id="module-recorder" class="module"></section>
      <section id="module-scale" class="module"></section>
      <section id="module-sight" class="module"></section>
      <section id="module-scf" class="module"></section>
      <section id="module-ear" class="module"></section>
      <section id="module-dynamics" class="module"></section>
      <section id="module-transpose" class="module"></section>
      <section id="module-rhythmtrain" class="module"></section>
      <section id="module-melody" class="module"></section>
      <section id="module-chordprog" class="module"></section>
      <section id="module-beat" class="module"></section>
      <section id="module-hands" class="module"></section>
      <section id="module-arp" class="module"></section>
      <section id="module-artic" class="module"></section>
      <section id="module-pedt" class="module"></section>
      <section id="module-trill" class="module"></section>
      <section id="module-ornament" class="module"></section>
      <section id="module-leap" class="module"></section>
      <section id="module-voicing" class="module"></section>
      <section id="module-cresc" class="module"></section>
      <section id="module-temporamp" class="module"></section>
      <section id="module-poly" class="module"></section>
      <section id="module-even" class="module"></section>
      <section id="module-finger" class="module"></section>
      <section id="module-span" class="module"></section>
      <section id="module-dict" class="module"></section>
      <section id="module-trans" class="module"></section>
      <section id="module-inv" class="module"></section>
      <section id="module-keysig" class="module"></section>
      <section id="module-fing" class="module"></section>
      <section id="module-ivb" class="module"></section>
      <section id="module-modeid" class="module"></section>
      <section id="module-solfege" class="module"></section>
      <section id="module-cquality" class="module"></section>
      <section id="module-progear" class="module"></section>
      <section id="module-cad" class="module"></section>
      <section id="module-noteid" class="module"></section>
      <section id="module-staffread" class="module"></section>
      <section id="module-sphrase" class="module"></section>
      <section id="module-csight" class="module"></section>
      <section id="module-rsight" class="module"></section>
      <section id="module-cof" class="module"></section>
      <section id="module-dash" class="module"></section>
      <section id="module-monitor" class="module"></section>
    </main>
  </div>

  <div id="log"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
