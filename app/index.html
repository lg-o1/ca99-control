<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CA99 Control</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
</head>
<body>
  <header id="topbar">
    <h1>🎹 CA99 Control</h1>
    <div id="conn-status" class="status off">未连接</div>
    <select id="output-select" title="输出端口（发命令）"></select>
    <select id="input-select" title="输入端口（接按键）"></select>
    <button id="connect-btn">连接</button>
  </header>

  <div id="layout">
    <nav id="sidebar">
      <button class="nav-btn active" data-module="sounds">🎵 音色浏览器</button>
      <button class="nav-btn" data-module="vt">🔧 VT 调音台</button>
      <button class="nav-btn" data-module="system">🎛️ 系统/混响</button>
      <button class="nav-btn" data-module="rhythm">🥁 节奏</button>
      <button class="nav-btn" data-module="auto">🔄 自动换音色</button>
      <button class="nav-btn" data-module="morph">🌗 VT 渐变器</button>
      <button class="nav-btn" data-module="velocity">🎚️ 力度换音色</button>
      <button class="nav-btn" data-module="velvt">💫 力度→VT联动</button>
      <button class="nav-btn" data-module="pedal">🦶 踏板控制</button>
      <button class="nav-btn" data-module="presets">⭐ 演出预设</button>
      <button class="nav-btn" data-module="chord">🎓 和弦练习</button>
      <button class="nav-btn" data-module="metro">🎵 节拍器</button>
      <button class="nav-btn" data-module="recorder">⏺ 录制回放</button>
      <button class="nav-btn" data-module="scale">🎼 音阶练习</button>
      <button class="nav-btn" data-module="sight">👀 视奏闪卡</button>
      <button class="nav-btn" data-module="monitor">📡 MIDI 监视器</button>
      <!-- 后续玩法模块在此追加：VT渐变/自动伴奏/灯光 -->
    </nav>
    <main id="content">
      <section id="module-sounds" class="module active"></section>
      <section id="module-vt" class="module"></section>
      <section id="module-system" class="module"></section>
      <section id="module-rhythm" class="module"></section>
      <section id="module-auto" class="module"></section>
      <section id="module-morph" class="module"></section>
      <section id="module-velocity" class="module"></section>
      <section id="module-velvt" class="module"></section>
      <section id="module-pedal" class="module"></section>
      <section id="module-presets" class="module"></section>
      <section id="module-chord" class="module"></section>
      <section id="module-metro" class="module"></section>
      <section id="module-recorder" class="module"></section>
      <section id="module-scale" class="module"></section>
      <section id="module-sight" class="module"></section>
      <section id="module-monitor" class="module"></section>
    </main>
  </div>

  <div id="log"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
