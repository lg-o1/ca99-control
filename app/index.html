<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CA99 Control</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
</head>
<body>
  <header id="topbar">
    <h1>🎹 CA99 Control</h1>
    <span id="active-crumb" class="crumb"></span>
    <div id="conn-status" class="status off">未连接</div>
    <label id="preview-piano-wrap" class="topbar-toggle" title="开启后各练习的「预听 / 示范」声音会直接送到已连接的 CA99 钢琴发声（音色更真实）；关闭则只用电脑发声"><input type="checkbox" id="preview-piano-toggle" checked> 🎹 预听走真琴</label>
    <select id="output-select" title="输出端口（发命令）"></select>
    <select id="input-select" title="输入端口（接按键）"></select>
    <button id="connect-btn">连接</button>
  </header>

  <div id="daily-strip" aria-live="polite"></div>

  <div id="layout">
    <nav id="sidebar">
      <div id="nav-level-wrap">
        <div class="nav-level-bar" role="group" aria-label="难度过滤">
          <button class="nav-level-btn active" data-level-filter="1">🌱 初级</button>
          <button class="nav-level-btn" data-level-filter="2">🌿 进阶</button>
          <button class="nav-level-btn" data-level-filter="all">🔥 全部</button>
        </div>
      </div>
      <div id="nav-search-wrap">
        <input id="nav-search" type="text" placeholder="🔍 搜索模块…" autocomplete="off" spellcheck="false">
      </div>
      <div class="nav-scroll">
        <div class="nav-group" data-group="控制台">
          <div class="nav-group-title">🎛️ 演奏控制</div>
          <button class="nav-btn active" data-module="sounds" data-level="1">🎵 音色浏览器</button>
          <button class="nav-btn" data-module="vt" data-level="2">🔧 VT 调音台</button>
          <button class="nav-btn" data-module="system" data-level="2">🎛️ 系统/混响</button>
          <button class="nav-btn" data-module="rhythm" data-level="1">🥁 节奏</button>
          <button class="nav-btn" data-module="auto" data-level="2">🔄 自动换音色</button>
          <button class="nav-btn" data-module="morph" data-level="3">🌗 VT 渐变器</button>
          <button class="nav-btn" data-module="velocity" data-level="3">🎚️ 力度换音色</button>
          <button class="nav-btn" data-module="velvt" data-level="3">💫 力度→VT联动</button>
          <button class="nav-btn" data-module="pedal" data-level="2">🦶 踏板控制</button>
          <button class="nav-btn" data-module="presets" data-level="2">⭐ 演出预设</button>
        </div>
        <div class="nav-group" data-group="练习室">
          <div class="nav-group-title">🎓 练习训练</div>
          <button class="nav-btn" data-module="chord" data-level="2">🎓 和弦练习</button>
          <button class="nav-btn" data-module="scale" data-level="1">🎼 音阶练习</button>
          <button class="nav-btn" data-module="sight" data-level="1">👀 视奏闪卡</button>
          <button class="nav-btn" data-module="scf" data-level="1">🎹 曲谱跟弹</button>
          <button class="nav-btn" data-module="play" data-level="1">🎬 演奏台</button>
          <button class="nav-btn" data-module="boss" data-level="1">🐉 Boss 战</button>
          <button class="nav-btn" data-module="speedrun" data-level="1">🚀 极速挑战</button>
          <button class="nav-btn" data-module="dice" data-level="1">🎲 骰子热身</button>
          <button class="nav-btn" data-module="bingo" data-level="1">🎯 练习宾果</button>
          <button class="nav-btn" data-module="guess" data-level="1">🕵️ 猜歌视奏</button>
          <button class="nav-btn" data-module="ear" data-level="2">👂 音程听辨</button>
          <button class="nav-btn" data-module="dynamics" data-level="1">💪 力度练习</button>
          <button class="nav-btn" data-module="transpose" data-level="2">🎹 移调器</button>
          <button class="nav-btn" data-module="rhythmtrain" data-level="1">🥁 节奏跟拍</button>
          <button class="nav-btn" data-module="melody" data-level="3">🎼 旋律听写</button>
          <button class="nav-btn" data-module="chordprog" data-level="3">🎹 和弦进行</button>
          <button class="nav-btn" data-module="beat" data-level="2">📈 节拍稳定度</button>
          <button class="nav-btn" data-module="hands" data-level="2">🙌 双手协调</button>
          <button class="nav-btn" data-module="arp" data-level="2">🎶 琶音跑动</button>
          <button class="nav-btn" data-module="artic" data-level="2">🎻 连奏断奏</button>
          <button class="nav-btn" data-module="pedt" data-level="3">🦶 踏板时机</button>
          <button class="nav-btn" data-module="trill" data-level="3">🪶 颤音速度</button>
          <button class="nav-btn" data-module="ornament" data-level="3">🎵 装饰音</button>
          <button class="nav-btn" data-module="leap" data-level="2">🎯 音程大跳</button>
          <button class="nav-btn" data-module="voicing" data-level="3">🔝 旋律突出</button>
          <button class="nav-btn" data-module="cresc" data-level="2">🎚️ 力度渐变</button>
          <button class="nav-btn" data-module="temporamp" data-level="2">🚀 速度渐变</button>
          <button class="nav-btn" data-module="poly" data-level="3">🥁 复节奏</button>
          <button class="nav-btn" data-module="even" data-level="3">💧 颗粒性</button>
          <button class="nav-btn" data-module="finger" data-level="2">🖐️ 手指独立性</button>
          <button class="nav-btn" data-module="span" data-level="2">🎹 音阶八度跨度</button>
          <button class="nav-btn" data-module="dict" data-level="2">👂 节奏听写</button>
          <button class="nav-btn" data-module="trans" data-level="3">🎼 移调视奏</button>
          <button class="nav-btn" data-module="inv" data-level="3">🎹 和弦转位听辨</button>
          <button class="nav-btn" data-module="keysig" data-level="2">🎼 调号识别</button>
          <button class="nav-btn" data-module="fing" data-level="1">🖐️ 音阶指法提示</button>
          <button class="nav-btn" data-module="ivb" data-level="2">🎯 音程构建</button>
          <button class="nav-btn" data-module="modeid" data-level="3">🎶 调式识别</button>
          <button class="nav-btn" data-module="solfege" data-level="2">🎵 唱名听辨</button>
          <button class="nav-btn" data-module="cquality" data-level="3">🎹 和弦性质听辨</button>
          <button class="nav-btn" data-module="progear" data-level="3">🎶 和声进行听辨</button>
          <button class="nav-btn" data-module="cad" data-level="3">🔚 终止式辨认</button>
          <button class="nav-btn" data-module="noteid" data-level="1">🔤 键盘音名认知</button>
          <button class="nav-btn" data-module="staffread" data-level="1">🎼 五线谱识谱卡</button>
          <button class="nav-btn" data-module="sphrase" data-level="2">🎼 乐句视奏</button>
          <button class="nav-btn" data-module="csight" data-level="3">🎹 和弦视奏</button>
          <button class="nav-btn" data-module="rsight" data-level="2">🥁 节奏视奏</button>
          <button class="nav-btn" data-module="accomp" data-level="3">🪗 伴奏音型</button>
          <button class="nav-btn" data-module="ccolor" data-level="2">🌈 和弦色彩板</button>
          <button class="nav-btn" data-module="lightshow" data-level="1">🎆 自由演奏灯光秀</button>
          <button class="nav-btn" data-module="melecho" data-level="2">🔁 旋律回声</button>
          <button class="nav-btn" data-module="callresp" data-level="3">🎼 即兴问答</button>
          <button class="nav-btn" data-module="rhyecho" data-level="1">🥁 节奏回声</button>
          <button class="nav-btn" data-module="pitchdir" data-level="1">↕️ 高低音方向感</button>
          <button class="nav-btn" data-module="mplayer" data-level="1">🎹 钢琴卷帘播放器</button>
          <button class="nav-btn" data-module="staffview" data-level="1">🎼 五线谱播放器</button>
        </div>
        <div class="nav-group" data-group="工具箱">
          <div class="nav-group-title">🛠️ 工具</div>
          <button class="nav-btn" data-module="cof" data-level="2">🎡 五度圈</button>
          <button class="nav-btn" data-module="metro" data-level="1">🎵 节拍器</button>
          <button class="nav-btn" data-module="recorder" data-level="1">⏺ 录制回放</button>
          <button class="nav-btn" data-module="dash" data-level="1">🏆 成就仪表盘</button>
          <button class="nav-btn" data-module="monitor" data-level="3">📡 MIDI 监视器</button>
        </div>
        <div id="nav-empty" class="nav-empty" hidden>没有匹配的模块</div>
      </div>
    </nav>
    <main id="content">
      <section id="module-sounds" class="module active"></section>
      <section id="module-vt" class="module"></section>
      <section id="module-system" class="module"></section>
      <section id="module-rhythm" class="module"></section>
      <section id="module-auto" class="module"></section>
      <section id="module-morph" class="module"></section>
      <section id="module-velocity" class="module"></section>
      <section id="module-velvt" class="module"></section>
      <section id="module-pedal" class="module"></section>
      <section id="module-presets" class="module"></section>
      <section id="module-chord" class="module"></section>
      <section id="module-metro" class="module"></section>
      <section id="module-recorder" class="module"></section>
      <section id="module-scale" class="module"></section>
      <section id="module-sight" class="module"></section>
      <section id="module-scf" class="module"></section>
      <section id="module-play" class="module"></section>
      <section id="module-boss" class="module"></section>
      <section id="module-speedrun" class="module"></section>
      <section id="module-dice" class="module"></section>
      <section id="module-bingo" class="module"></section>
      <section id="module-guess" class="module"></section>
      <section id="module-ear" class="module"></section>
      <section id="module-dynamics" class="module"></section>
      <section id="module-transpose" class="module"></section>
      <section id="module-rhythmtrain" class="module"></section>
      <section id="module-melody" class="module"></section>
      <section id="module-chordprog" class="module"></section>
      <section id="module-beat" class="module"></section>
      <section id="module-hands" class="module"></section>
      <section id="module-arp" class="module"></section>
      <section id="module-artic" class="module"></section>
      <section id="module-pedt" class="module"></section>
      <section id="module-trill" class="module"></section>
      <section id="module-ornament" class="module"></section>
      <section id="module-leap" class="module"></section>
      <section id="module-voicing" class="module"></section>
      <section id="module-cresc" class="module"></section>
      <section id="module-temporamp" class="module"></section>
      <section id="module-poly" class="module"></section>
      <section id="module-even" class="module"></section>
      <section id="module-finger" class="module"></section>
      <section id="module-span" class="module"></section>
      <section id="module-dict" class="module"></section>
      <section id="module-trans" class="module"></section>
      <section id="module-inv" class="module"></section>
      <section id="module-keysig" class="module"></section>
      <section id="module-fing" class="module"></section>
      <section id="module-ivb" class="module"></section>
      <section id="module-modeid" class="module"></section>
      <section id="module-solfege" class="module"></section>
      <section id="module-cquality" class="module"></section>
      <section id="module-progear" class="module"></section>
      <section id="module-cad" class="module"></section>
      <section id="module-noteid" class="module"></section>
      <section id="module-staffread" class="module"></section>
      <section id="module-sphrase" class="module"></section>
      <section id="module-csight" class="module"></section>
      <section id="module-rsight" class="module"></section>
      <section id="module-accomp" class="module"></section>
      <section id="module-ccolor" class="module"></section>
      <section id="module-lightshow" class="module"></section>
      <section id="module-melecho" class="module"></section>
    <section id="module-callresp" class="module"></section>
      <section id="module-rhyecho" class="module"></section>
      <section id="module-pitchdir" class="module"></section>
      <section id="module-mplayer" class="module"></section>
      <section id="module-staffview" class="module"></section>
      <section id="module-cof" class="module"></section>
      <section id="module-dash" class="module"></section>
      <section id="module-monitor" class="module"></section>
    </main>
  </div>

  <div id="log"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
