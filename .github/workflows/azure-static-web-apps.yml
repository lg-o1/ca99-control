name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            app
            !app/midi-collection/sheets/*/
          sparse-checkout-cone-mode: false

      - name: Keep only sheets/index.json
        run: |
          # Remove all sheet subdirs (PNG/PDF) but keep index.json
          find app/midi-collection/sheets -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/app"
          output_location: ""
          skip_app_build: true
