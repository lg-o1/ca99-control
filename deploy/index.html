<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LH</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
  --accent:#58a6ff;
}
html{height:100%}
body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;align-items:center}

header{width:100%;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--bg2)}
.logo{font-size:1.3em;font-weight:700;text-decoration:none}
.logo-text{
  background:linear-gradient(90deg,#ff6b6b,#ffa600,#ffe600,#48c774,#3ec6ff,#a463f2,#ff6bb5);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;font-weight:800;
}
header nav{display:flex;gap:12px;align-items:center}
header nav a{color:var(--muted);text-decoration:none;font-size:.85em}
header nav a:hover{color:var(--accent)}
#admin-toggle{background:none;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:3px 10px;font-size:.8em;cursor:pointer}
#admin-toggle:hover{border-color:var(--accent);color:var(--accent)}
#admin-toggle.active{background:var(--accent);border-color:var(--accent);color:#fff}

.hero{text-align:center;padding:50px 24px 30px;max-width:600px}
.hero h1{font-size:2.4em;margin-bottom:8px}
.hero h1 span{
  background:linear-gradient(90deg,#ff6b6b,#ffa600,#ffe600,#48c774,#3ec6ff,#a463f2,#ff6bb5);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;font-weight:800;
}
.hero p{color:var(--muted);font-size:1em}

.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding:0 24px 50px;max-width:820px;width:100%}
.app-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:22px;text-decoration:none;color:var(--text);transition:border-color .2s,transform .15s;display:flex;flex-direction:column;gap:6px}
.app-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.app-card .app-icon{font-size:2em}
.app-card .app-name{font-size:1.1em;font-weight:600}
.app-card .app-desc{font-size:.82em;color:var(--muted);line-height:1.5}
.app-card .app-status{font-size:.7em;margin-top:auto;padding-top:8px}
.app-card .app-status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.dot-live{background:#3fb950}
.dot-dev{background:#d29922}
.dot-hidden{background:#8b949e}

/* Hidden apps: shown only when role has access */
.app-card.hidden-app{display:none}
body.role-admin .app-card.hidden-app{display:flex;opacity:.7;border-style:dashed}
body.role-admin .app-card.hidden-app:hover{opacity:1}
body.role-work .app-card[data-role="work"]{display:flex}
body.role-puzzle .app-card[data-role="puzzle"]{display:flex}
#passcode-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:3px 10px;font-size:1em;cursor:pointer}
#passcode-btn:hover{border-color:var(--accent);color:var(--accent)}
#passcode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.role-badge{font-size:.7em;color:var(--muted);margin-left:8px}

/* Admin room panel */
.admin-panel{display:none;max-width:820px;width:100%;padding:0 24px 20px;margin:0 auto}
body.role-admin .admin-panel{display:block}
.admin-panel h3{font-size:.9em;color:var(--muted);margin-bottom:8px}
.room-list{display:flex;flex-direction:column;gap:6px}
.room-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:.85em}
.room-item .room-name{font-weight:600;color:var(--accent)}
.room-item .room-meta{color:var(--muted);font-size:.8em}
.room-item button{background:#f85149;color:#fff;border:none;border-radius:4px;padding:3px 10px;font-size:.75em;cursor:pointer}
.room-item button:hover{opacity:.8}

/* Activity feed */
.activity-panel{max-width:820px;width:100%;padding:0 24px 20px;margin:0 auto}
.activity-panel h3{font-size:.85em;color:var(--muted);margin-bottom:6px}
.activity-feed{display:flex;flex-direction:column;gap:3px}
.activity-item{display:flex;align-items:center;gap:8px;font-size:.8em;color:var(--muted);padding:2px 0}
.activity-avatar{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}
.activity-name{color:var(--text);font-weight:600}
.activity-mask{color:var(--border);letter-spacing:1px}
.activity-time{margin-left:auto;font-size:.7em}

footer{display:none}
@media(max-width:600px){.hero h1{font-size:1.8em}.apps{grid-template-columns:1fr;padding:0 16px 40px}}
</style>
</head>
<body>

<header>
  <a href="/" class="logo"><span class="logo-text">LH</span><span class="role-badge" id="role-badge"></span></a>
  <nav>
    <button id="passcode-btn" onclick="togglePasscode()" title="Enter passcode">🔑</button>
  </nav>
</header>

<section class="hero">
  <h1><span>LH</span></h1>
  <p><a href="https://tinyurl.com/lili-home" style="color:var(--muted);text-decoration:none;font-size:1em">tinyurl.com/lili-home</a></p>
</section>

<div class="apps" id="apps"></div>

<div class="admin-panel" id="admin-panel">
  <h3>💬 Chat Rooms</h3>
  <div class="room-list" id="room-list">Loading...</div>
</div>

<div class="activity-panel">
  <h3>👥 Recent Activity</h3>
  <div class="activity-feed" id="activity-feed"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  APP CONFIGURATION — edit this to add/hide/show apps
// ══════════════════════════════════════════════════════
const APPS = [
  {
    id: 'piano',
    icon: '🎹',
    name: 'Piano Studio',
    desc: '1000+ MIDI songs — score follow, staff view, piano roll',
    url: '/piano/',

    visible: true,
    role: ''
  },
  {

    url: '/viewer/#test/index.md',

    visible: true,
    role: ''
  },
  {
    id: 'puzzle',
    icon: '🧩',
    name: 'PuzzleIsland',
    desc: '480+ logic puzzles — bilingual, interactive',
    url: '/viewer/#puzzle/index.md',
    status: 'dev',
    visible: false,
    role: 'puzzle'
  },
  {
    id: 'work',
    icon: '💼',
    name: 'Work Docs',
    desc: 'Reports, architecture docs',
    url: '/viewer/#work/index.md',
    status: 'live',
    visible: false,
    role: 'work'
  },
  {
    id: 'english',
    icon: '✏️',
    name: 'English Writing',
    desc: 'Coming soon',
    url: '/viewer/#english/index.md',
    status: 'coming',
    visible: false,
    role: 'work'
  },
  {
    id: 'mesh',
    icon: '◈',
    name: 'Mesh Portal',
    desc: 'Live status of mesh codespace nodes + join a new node',
    url: '/mesh/',
    status: 'live',
    visible: false,
    role: 'mesh'
  },
  {
    id: 'profile',
    icon: '🎭',
    name: 'Personality Profile',
    desc: 'Coming soon',
    url: '#',
    status: 'coming',
    visible: false,
    role: 'admin'
  },
  {
    id: 'download',
    icon: '📱',
    name: 'Download App',
    desc: 'LH Android app 6MB build:20260622-0025',
    url: '/download/lili-hub.apk',
    status: 'live',
    visible: true,
    role: ''
  },
  {
    id: 'md',
    icon: '📝',
    name: 'MD Content',
    desc: 'Private markdown content from GitHub',
    url: '/viewer/#md/',
    status: 'live',
    visible: false,
    role: 'md'
  },
  {
    id: 'games',
    icon: '🎮',
    name: 'Games',
    desc: 'Offline HTML games',
    url: '/viewer/#games/',
    status: 'live',
    visible: false,
    role: 'games'
  },
  {
    id: 'board',
    icon: '📋',
    name: 'Board',
    desc: 'Copilot Manager board — messages and session handoffs',
    url: '/board/',
    status: 'live',
    visible: false,
    role: 'admin'
  },
  {
    id: 'secrets',
    icon: '🔐',
    name: 'Secrets',
    desc: 'Encrypted secrets manager (R2 backend)',
    url: '/secrets/',
    status: 'live',
    visible: false,
    role: 'admin'
  }
];
// ══════════════════════════════════════════════════════

const STATUS_LABEL = {
  live:   '<span class="dot dot-live"></span>Live',
  dev:    '<span class="dot dot-dev"></span>In Development',
  coming: '<span class="dot dot-hidden"></span>Coming Soon'
};

function renderApps() {
  const container = document.getElementById('apps');
  const role = localStorage.getItem('lh-role') || '';
  container.innerHTML = APPS.map(app => {
    const showByRole = app.visible || role === 'admin' || (app.role && app.role === role);
    const hidden = !showByRole ? ' hidden-app' : '';
    const disabled = app.status === 'coming' ? ' style="pointer-events:none;opacity:.4"' : '';
    return `<a href="${app.url}" class="app-card${hidden}" data-role="${app.role}"${disabled}>
      <div class="app-icon">${app.icon}</div>
      <div class="app-name">${app.name}</div>
      <div class="app-desc">${app.desc}</div>
      <div class="app-status">${STATUS_LABEL[app.status]}</div>
    </a>`;
  }).join('');
}

// ── Passcode system ──
const ROLE_MAP = {
  '628984': { role: 'admin', landing: '/', room: '/admin' },
  '00': { role: 'work', landing: '/viewer/#work/index.md', room: '/work' },
};

function applyRole(role) {
  document.body.className = document.body.className.replace(/role-\w+/g, '').trim();
  const btn = document.getElementById('passcode-btn');
  const badge = document.getElementById('role-badge');
  if (role) {
    document.body.classList.add('role-' + role);
    btn.classList.add('active');
    badge.textContent = role;
  } else {
    btn.classList.remove('active');
    badge.textContent = '';
  }
  renderApps();
  loadRoomStats();
  // Update chat room
  const room = localStorage.getItem('lh-room') || '/';
  if (window._cwSetRoom) window._cwSetRoom(room);
}

async function togglePasscode() {
  const currentRole = localStorage.getItem('lh-role');
  if (currentRole) {
    // Logout
    localStorage.removeItem('lh-role');
    localStorage.removeItem('lh-passcode');
    localStorage.removeItem('lh-room');
    applyRole('');
    return;
  }

  const pwd = prompt('🔑 Passcode:');
  if (!pwd) return;

  const mapped = ROLE_MAP[pwd];
  if (mapped) {
    localStorage.setItem('lh-role', mapped.role);
    localStorage.setItem('lh-passcode', pwd);
    localStorage.setItem('lh-room', mapped.room);
    applyRole(mapped.role);
    // Navigate to landing page
    if (mapped.landing !== '/') {
      window.location.href = mapped.landing;
    }
  } else {
    // Try verify-access API for unknown codes
    try {
      const res = await fetch('/api/verify-access', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pwd, path: '/' })
      });
      if (res.ok) {
        const data = await res.json();
        if (data.ok) {
          localStorage.setItem('lh-role', 'custom');
          localStorage.setItem('lh-passcode', pwd);
          localStorage.setItem('lh-room', '/');
          applyRole('custom');
          return;
        }
      }
    } catch(e) {}
    alert('❌ Invalid passcode');
  }
}

// Restore role on page load
const savedRole = localStorage.getItem('lh-role');
applyRole(savedRole || '');

// ── Admin room management ──
async function loadRoomStats() {
  if (localStorage.getItem('lh-role') !== 'admin') return;
  try {
    const r = await fetch('/api/chat?admin=1');
    const data = await r.json();
    const list = document.getElementById('room-list');
    const rooms = data.rooms || {};
    const entries = Object.entries(rooms);
    if (entries.length === 0) {
      list.innerHTML = '<span style="color:var(--muted);font-size:.85em">No messages in any room.</span>';
      return;
    }
    list.innerHTML = entries.map(([room, info]) => {
      const time = new Date(info.latest).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
      return `<div class="room-item">
        <span class="room-name">${room}</span>
        <span class="room-meta">${info.count} msg · ${time}</span>
        <button onclick="clearRoom('${room}')">🗑️ Clear</button>
      </div>`;
    }).join('');
  } catch(e) {}
}
async function clearRoom(room) {
  if (!confirm('Clear all messages in ' + room + '?')) return;
  await fetch('/api/chat?room=' + encodeURIComponent(room), { method: 'DELETE' });
  loadRoomStats();
}
window.clearRoom = clearRoom;
loadRoomStats();

// ── Activity feed (public, direct Turso read) ──
var TURSO_URL = 'https://lili-hub-jfpx.aws-us-west-2.turso.io';
var TURSO_RO = 'eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3ODEzNDMxOTgsInAiOnsicnciOnsibnMiOlsiMDE5ZWJmYjItODgwMS03ODg0LWIwMmUtNjIxYjI5OGUyZTZhIl19fSwicmlkIjoiZDFkMWM0NzItMzBjOS00Y2U2LWEyY2EtZjNkNjBjMGM0YWYzIn0.eciczT0GCJGtjkHWTQas3Qtob5W5tc5D5nr7nmCtXfgb70fkMmvbBd5_a-TKwoVgkHzI1-6tcua6MDl78n-RCw';

function nameColor(n){let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);return `hsl(${((h%360)+360)%360},60%,45%)`}

async function tursoQuery(sql) {
  var body = JSON.stringify({requests:[{type:'execute',stmt:{sql:sql}},{type:'close'}]});
  var r = await fetch(TURSO_URL+'/v3/pipeline',{method:'POST',headers:{Authorization:'Bearer '+TURSO_RO,'Content-Type':'application/json'},body:body});
  if(!r.ok) return [];
  var data = await r.json();
  var result = data.results && data.results[0] && data.results[0].response && data.results[0].response.result;
  if(!result || !result.rows) return [];
  var cols = result.cols.map(function(c){return c.name});
  return result.rows.map(function(row){var o={};row.forEach(function(c,i){o[cols[i]]=c.value});return o});
}

async function loadActivity() {
  try {
    var rows = await tursoQuery("SELECT name, room, ts, LENGTH(text) as chars FROM messages ORDER BY ts DESC LIMIT 20");
    var feed = document.getElementById('activity-feed');
    if (rows.length === 0) {
      feed.innerHTML = '<span style="color:var(--muted);font-size:.8em">No recent activity</span>';
      return;
    }
    feed.innerHTML = rows.map(function(a) {
      var chars = parseInt(a.chars);
      var mask = '*'.repeat(Math.min(chars, 30)) + (chars > 30 ? '…' : '');
      var time = new Date(a.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      var c = nameColor(a.name);
      return '<div class="activity-item">' +
        '<div class="activity-avatar" style="background:'+c+'">'+a.name[0].toUpperCase()+'</div>' +
        '<span class="activity-name">'+a.name+'</span>' +
        '<span style="color:var(--muted)">'+a.room+'</span>' +
        '<span class="activity-mask">'+mask+'</span>' +
        '<span class="activity-time">'+time+'</span>' +
      '</div>';
    }).join('');
  } catch(e) {}
}
loadActivity();
setInterval(loadActivity, 30000);
</script>
<script>
  // Dynamic room from localStorage
  var chatScript = document.createElement('script');
  chatScript.src = '/chat-widget.js';
  chatScript.setAttribute('data-room', localStorage.getItem('lh-room') || '/');
  chatScript.setAttribute('data-collapsed', 'false');
  document.body.appendChild(chatScript);
</script>

</body>
</html>
